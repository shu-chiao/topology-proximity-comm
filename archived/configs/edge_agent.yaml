# cargo run --bin zenoh_agent: agent + bridge settings. Paths resolve under archived/configs/ (or absolute).
# Your ros2 nodes still use DDS env from the shell; bridge side is bridge.* here.

zenoh:
  # peer: config_file (listen :7411 + scout zenohd). wan_client: client_config_file (subscriber-only; see README).
  topology: peer
  config_file: zenoh_agent-as-peer.json5
  client_config_file: zenoh_agent-as-client.json5

# main_sub uses edge_agent-sub.yaml instead.

bridge:
  # local_peer: zenoh_bridge-as-local-peer.json5 → :7411. client: zenoh_bridge-as-pub-client.json5 → zenohd.
  mode: local_peer
  skip_spawn: false
  verbose_logs: false
  detach: false
  executable: zenoh-bridge-ros2dds
  # Log ROS/DDS-related env at startup (trimmed).
  log_host_dds_env: true
