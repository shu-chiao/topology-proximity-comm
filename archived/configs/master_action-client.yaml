# ros2 action send_goal → main_action_client (Zenoh get). Override: MASTER_ACTION_CLIENT_YAML.
# Env: MAIN_ACTION_ROUTER, MAIN_ACTION_ZENOH_JSON5, MAIN_ACTION_KEYEXPR, MAIN_ACTION_TYPE,
# MAIN_ACTION_SEND_GOAL_TIMEOUT_MS, MAIN_ACTION_GET_RESULT_TIMEOUT_MS, MAIN_ACTION_SEQ,
# MAIN_ACTION_CLIENT_ID, MAIN_ACTION_THETA (merged into goal for RotateAbsolute).

ros2_action_send_goal:
  action_name: /turtle1/rotate_absolute
  action_type: turtlesim/action/RotateAbsolute
  goal:
    theta: 3.14

action_client:
  zenoh_json5: zenoh_agent-as-client.json5
  router: tcp/127.0.0.1:7447
  send_goal_timeout_ms: 10000
  get_result_timeout_ms: 60000
  seq: 1
  client_id: "0xd055e7276e40301"
